
@for (i of items; track i.id_producto) { 
  <div class="item"> 
    <img src="{{ i.imagen }}" alt="{{ i.nombre }}" />
    {{ i.nombre }} — ${{ i.precio_unitario }} x {{ i.cantidad }} 
    <button (click)="cambiarCantidad(i, i.cantidad + 1)">+</button> 
    <button (click)="cambiarCantidad(i, i.cantidad - 1)">-</button> 
    <button (click)="quitar(i.id_producto)">Quitar</button> 
  </div> 
} @empty { 
  <p>Tu carrito está vacío.</p> 
} 
@if (items.length > 0) { 
  <p>Total: ${{ total() }}</p> 
  <button (click)="vaciar()">Vaciar carrito</button> 

}
