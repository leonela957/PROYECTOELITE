
<div class="pagina-producto">

  @if (producto) {

    <h2 class="titulo-seccion">DETALLE DEL PRODUCTO</h2>

    <!-- CARRUSEL DE FOTOGRAFÍAS -->

    <div class="carrusel-producto">

      <div class="carrusel-imagenes">

        <img
          [src]="producto.imagen"
          [alt]="producto.nombre"
          [class.activa]="imagenActual === 0">

        <img
          [src]="producto.imagen"
          [alt]="producto.nombre"
          [class.activa]="imagenActual === 1">

        <img
          [src]="producto.imagen"
          [alt]="producto.nombre"
          [class.activa]="imagenActual === 2">

      </div>

      <!-- FLECHA ANTERIOR -->

      <button type="button"
              class="flecha anterior"
              (click)="anterior()">
        &#10094;
      </button>

      <!-- FLECHA SIGUIENTE -->

      <button type="button"
              class="flecha siguiente"
              (click)="siguiente()">
        &#10095;
      </button>

      <!-- INDICADORES -->

      <div class="indicadores">

        <button type="button"
                (click)="cambiarImagen(0)"
                [class.seleccionado]="imagenActual === 0">
        </button>

        <button type="button"
                (click)="cambiarImagen(1)"
                [class.seleccionado]="imagenActual === 1">
        </button>

        <button type="button"
                (click)="cambiarImagen(2)"
                [class.seleccionado]="imagenActual === 2">
        </button>

      </div>

    </div>

    <!-- INFORMACIÓN DEL PRODUCTO -->

    <div class="informacion-producto">

      <h1>{{producto.nombre}}</h1>

      <p class="descripcion">
        {{producto.descripcion}}
      </p>

      <div class="linea-dorada"></div>

      <p class="precio">Precio: ${{producto.precio}}</p>

      <h3>Colores disponibles</h3>
      <p>{{producto.color}}</p>

      <h3>Talles disponibles</h3>
      <p>{{producto.talle}}</p>

    </div>

  } @else {

    <h2>Producto no encontrado</h2>

  }

</div>
